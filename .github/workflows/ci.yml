name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: scripts/fetch-upstream.sh
      - run: python3 scripts/check-compatibility.py
      - run: scripts/verify-generated.sh
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Live FSM storage conformance
        env:
          AIOGRAM_REDIS_URL: redis://127.0.0.1:6379/15
          AIOGRAM_MONGODB_URL: mongodb://127.0.0.1:27017
        run: cargo test --lib --all-features live_ -- --ignored
      - run: cargo doc --no-deps --all-features
